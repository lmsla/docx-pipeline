[project]
name = "docx-pipeline"
version = "0.2.2"
description = "Markdown to enterprise DOCX pipeline with reference template and post-processing."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "python-docx>=1.1.2",
]

[project.scripts]
docx-pipeline = "docx_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
