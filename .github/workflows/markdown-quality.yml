name: Markdown quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Markdown (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate valid fixtures
        run: |
          docx-pipeline validate tests/fixtures/valid/engineering-note.md
          docx-pipeline validate tests/fixtures/valid/enterprise-sop.md

      - name: Reject invalid fixtures
        run: |
          for file in tests/fixtures/invalid/*.md; do
            if docx-pipeline validate "$file"; then
              echo "expected validation failure: $file" >&2
              exit 1
            fi
          done

      - name: Check Claude Code Plugin layout
        run: |
          test -s skills/docx-authoring/SKILL.md
          test -s .claude-plugin/plugin.json
          test -s .claude-plugin/marketplace.json
          python - <<'PY'
          import json

          plugin = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))
          assert plugin["name"] == "docx-pipeline"
          assert plugin["version"]

          marketplace = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          assert marketplace["name"] == "docx-pipeline-marketplace"
          entries = [item for item in marketplace["plugins"] if item["name"] == "docx-pipeline"]
          assert len(entries) == 1
          assert entries[0]["source"] == "."
          assert entries[0]["version"] == plugin["version"]
          PY

      - name: Check AI agent Plugin manifests
        run: |
          test -s plugin.json
          test -s .codex-plugin/plugin.json
          python - <<'PY'
          import json

          plugin = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))

          antigravity = json.load(open("plugin.json", encoding="utf-8"))
          assert antigravity["name"] == "docx-pipeline"
          assert antigravity["description"]

          codex = json.load(open(".codex-plugin/plugin.json", encoding="utf-8"))
          assert codex["name"] == "docx-pipeline"
          assert codex["version"] == plugin["version"]
          assert codex["skills"] == "./skills/"
          assert codex["author"]["name"]
          assert codex["interface"]["displayName"]
          assert codex["interface"]["defaultPrompt"]
          PY

      - name: Check version consistency
        run: |
          python - <<'PY'
          import json, re, pathlib

          plugin = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))["version"]
          codex = json.load(open(".codex-plugin/plugin.json", encoding="utf-8"))["version"]
          market = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))["plugins"][0]["version"]
          pyproject = re.search(r'^version = "(.+?)"', pathlib.Path("pyproject.toml").read_text(), re.M).group(1)
          setup = re.search(r'version="(.+?)"', pathlib.Path("setup.py").read_text()).group(1)
          dunder = re.search(r'__version__ = "(.+?)"', pathlib.Path("src/docx_pipeline/__init__.py").read_text()).group(1)

          versions = {
              ".claude-plugin/plugin.json": plugin,
              ".codex-plugin/plugin.json": codex,
              ".claude-plugin/marketplace.json": market,
              "pyproject.toml": pyproject,
              "setup.py": setup,
              "src/docx_pipeline/__init__.py": dunder,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"version mismatch: {versions}")
          print(f"all manifests agree on version {plugin}")
          PY

      - name: Reject committed reference.docx
        run: |
          if git ls-files --error-unmatch templates/reference.docx >/dev/null 2>&1; then
            echo "templates/reference.docx must not be committed (public repo)." >&2
            exit 1
          fi
          echo "reference.docx correctly absent from version control"

      - name: Check Skill resources
        run: |
          test -s templates/ai-agent-markdown-rules.md
          test -s templates/engineering-note-template.md
          test -s templates/enterprise-sop-template.md
          test -s docs/skill-installation.md
